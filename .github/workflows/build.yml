name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev automake autopoint gettext
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Prepare main.py
        run: |
          if [ ! -f main.py ] && [ -f app.py ]; then
            cp app.py main.py
          fi

      - name: Prepare python-for-android
        run: |
          git clone --depth 1 https://github.com/kivy/python-for-android.git p4a
          rm -rf p4a/pythonforandroid/recipes/reportlab
          echo "p4a.source_dir = $GITHUB_WORKSPACE/p4a" >> buildozer.spec

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carnet-de-dettes-apk
          path: bin/*.apk
          if-no-files-found: error