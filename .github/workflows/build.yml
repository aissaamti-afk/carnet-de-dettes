name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "cython==0.29.34"
          python -m pip install buildozer

      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          ls -la
          echo "===== PYTHON VERSION ====="
          python --version
          echo "===== BUILDOZER VERSION ====="
          buildozer --version
          echo "===== MAIN.PY ====="
          test -f main.py && echo "main.py OK" || (echo "ERROR: main.py missing" && exit 1)
          echo "===== BUILDOZER.SPEC ====="
          test -f buildozer.spec && echo "buildozer.spec OK" || (echo "ERROR: buildozer.spec missing" && exit 1)

      - name: Clean old build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer -v android debug

      - name: Show APK files
        if: always()
        run: |
          echo "===== BIN DIRECTORY ====="
          ls -lah bin || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carnet-de-dettes-apk
          path: bin/*.apk
          if-no-files-found: error
